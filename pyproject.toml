[tool.poetry]
name = "x4-advisor"
version = "0.1.0"
description = "X4 Foundations Advisor Application"
authors = ["Peter <peadarpol@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "x4_advisor", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
sqlite-vec = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring live Ollama endpoint or external database",
]

[tool.poetry.scripts]
x4-advisor = "x4_advisor.cli:main"

