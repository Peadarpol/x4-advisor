repos:
- repo: local
  hooks:
    - id: check-active-repo
      name: Verify active repository
      entry: python .agent/scripts/check_repo.py
      language: python
      always_run: true
      pass_filenames: false

    - id: pytest-gate
      name: Run test suite
      entry: poetry run pytest
      language: system
      pass_filenames: false
      always_run: true
